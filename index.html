<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online Praktik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigasi -->
    <header>
        <h1>Toko Keren</h1>
        <p>Tempat Belanja Pakaian Terlengkap</p>
    </header>

    <!-- Bagian Produk -->
    <main class="kontainer-produk">
        
        <!-- Produk 1 -->
        <div class="kartu-produk">
            <img src="https://placeholder.com" alt="Jaket Keren">
            <h3>Jaket Denim Keren</h3>
            <p class="harga">Rp 250.000</p>
            <button class="btn-beli">Beli Sekarang</button>
        </div>

        <!-- Produk 2 -->
        <div class="kartu-produk">
            <img src="https://placeholder.com" alt="Kaos Polos">
            <h3>Kaos Polos Cotton</h3>
            <p class="harga">Rp 75.000</p>
            <button class="btn-beli">Beli Sekarang</button>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Toko Keren - Hak Cipta Dilindungi</p>
    </footer>

</body>
</html>
